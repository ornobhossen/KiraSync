<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KiraSYCN | Diner</title>
    <link rel="stylesheet" href="app.css">
    <style>
        /* Diner-specific Light Mode Overrides for UI Elements */
        .diner-avatar {
            background: #222;
            color: #FFF;
        }
        body.light-theme .diner-avatar {
            background: #E5E5EA;
            color: #1D1D1F;
        }
        .diner-avatar.selected {
            background: var(--accent-brass) !important;
            color: #000 !important;
        }
        .bill-avatar {
            background: #333;
            color: #FFF;
        }
        body.light-theme .bill-avatar {
            background: #D2D2D7;
            color: #1D1D1F;
        }
    </style>
</head>
<body style="background-color: var(--bg-color, #050608);">
    
    <!-- THEME TOGGLE HEADER -->
    <div style="display: flex; justify-content: flex-end; padding: max(20px, env(safe-area-inset-top)) 20px 0; max-width: 600px; margin: 0 auto;">
        <button class="btn btn-outline" id="themeToggleBtn" style="padding: 8px; font-size: 16px; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--bg-color); z-index: 50;" title="Toggle Theme">☀️</button>
    </div>

    <div class="app-container" id="app" style="padding-top: 10px;">
        <!-- Dynamic content injected here by JS -->
    </div>

    <!-- Bottom Sheet for Item Assignment -->
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="itemSheet">
        <h3 id="sheetItemName" style="margin-bottom: 5px;">Item Name</h3>
        <p class="text-muted" id="sheetItemPrice" style="margin-bottom: 20px;">RM 0.00</p>
        
        <div style="margin-bottom: 20px;">
            <p style="margin-bottom: 10px; font-weight: 500;">Who is sharing this dish?</p>
            <div id="sheetDinersList" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;">
                <!-- Diners populated here -->
            </div>
        </div>
        
        <button class="btn btn-primary" id="confirmAssignBtn">Confirm Assignment</button>
    </div>

    <script type="module" src="diner.js"></script>
</body>
</html>
